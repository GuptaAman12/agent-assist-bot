<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Knowledge Base Manager</title>
  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem('theme'); } catch (e) {}
      var dark = t === 'dark' || (!t && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    })();
  </script>
  <link rel="stylesheet" href="/static/style.css?v=8">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
      </span>
      <span class="brand-name">Knowledge Base</span>
      <span class="brand-tag">Manager</span>
    </div>
    <nav class="topbar-actions">
      <a href="/static/index.html" class="nav-link">Dashboard</a>
    </nav>
  </header>

  <main class="layout kb-page">
    <section class="card kb-main-card">
      <div class="result-head">
        <h2 class="card-title">Entries (<span id="kb-count">0</span>)</h2>
        <button type="button" id="kb-reload-btn" class="btn-ghost btn-small" title="Re-read knowledge_base.json from disk">Reload from disk</button>
      </div>
      <p class="kb-hint">Changes apply instantly — no server restart needed. You can also edit <code>knowledge_base.json</code> directly; the dashboard picks it up on the next query.</p>
      <div class="kb-toolbar">
        <input type="text" id="kb-search" placeholder="Filter entries…" autocomplete="off" />
      </div>
      <ul id="kb-list" class="history-list kb-list"></ul>
      <form id="kb-add-form" class="kb-add-form">
        <h3 class="card-title">Add new entry</h3>
        <input type="text" id="kb-question" placeholder="Question (optional, e.g. 'How do I reset my password?')" autocomplete="off" />
        <textarea id="kb-response" rows="3" placeholder="Answer text (required)…" required></textarea>
        <button type="submit" id="kb-add-btn" class="btn-primary" title="Add entry and re-embed immediately">Add entry</button>
      </form>
      <p id="kb-error" class="error-banner kb-error" hidden></p>
    </section>
  </main>

  <script src="/static/kb.js?v=1"></script>
</body>
</html>
