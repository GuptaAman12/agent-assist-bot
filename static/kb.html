<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Knowledge Base Manager</title>
  <link rel="icon" type="image/png" href="/static/logo.png?v=1">
  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem('theme'); } catch (e) {}
      var dark = t === 'dark' || (!t && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    })();
  </script>
  <link rel="stylesheet" href="/static/style.css?v=23">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <img src="/static/logo.png?v=1" alt="" class="brand-logo" />
      </span>
      <span class="brand-name">Knowledge Base</span>
      <span class="brand-tag">Manager</span>
    </div>
    <nav class="topbar-actions">
      <a href="/static/index.html" class="nav-link">Dashboard</a>
      <button type="button" id="theme-toggle" class="icon-btn" aria-label="Toggle dark mode" title="Toggle dark / light mode">
        <svg id="icon-moon" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        <svg id="icon-sun" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" hidden><circle cx="12" cy="12" r="4"/><line x1="12" y1="2" x2="12" y2="5"/><line x1="12" y1="19" x2="12" y2="22"/><line x1="4.93" y1="4.93" x2="6.99" y2="6.99"/><line x1="17.01" y1="17.01" x2="19.07" y2="19.07"/><line x1="2" y1="12" x2="5" y2="12"/><line x1="19" y1="12" x2="22" y2="12"/><line x1="4.93" y1="19.07" x2="6.99" y2="17.01"/><line x1="17.01" y1="6.99" x2="19.07" y2="4.93"/></svg>
      </button>
    </nav>
  </header>

  <main class="layout kb-page">
    <p id="kb-error" class="error-banner kb-error kb-error-full" hidden></p>
    <section class="card kb-list-card" aria-label="Existing entries">
      <div class="result-head">
        <h2 class="card-title">Entries (<span id="kb-count">0</span>)</h2>
        <button type="button" id="kb-reload-btn" class="btn-ghost btn-small" title="Re-read knowledge_base.json from disk">Reload from disk</button>
      </div>
      <p class="kb-hint">Changes apply instantly - no server restart needed. You can also edit <code>knowledge_base.json</code> directly; the dashboard picks it up on the next query.</p>
      <div class="kb-toolbar">
        <input type="text" id="kb-search" placeholder="Filter entries…" autocomplete="off" />
      </div>
      <div class="kb-import-export" style="display:flex; gap:8px; margin: 0 0 10px;">
        <button type="button" id="kb-export-btn" class="btn-ghost btn-small" title="Download knowledge base as JSON">Export</button>
        <label for="kb-import-file" class="btn-ghost btn-small" style="cursor:pointer;" title="Import knowledge base from JSON file">Import</label>
        <input type="file" id="kb-import-file" accept=".json,application/json" hidden />
      </div>
      <ul id="kb-list" class="history-list kb-list"></ul>
      <div id="kb-pagination" class="kb-pagination" hidden>
        <button type="button" id="kb-prev" class="btn-ghost btn-small" title="Previous page">Prev</button>
        <span id="kb-page-info" class="kb-page-info"></span>
        <button type="button" id="kb-next" class="btn-ghost btn-small" title="Next page">Next</button>
      </div>
      <div id="kb-undo" class="kb-undo-banner" hidden>
        <span id="kb-undo-text"></span>
        <button type="button" id="kb-undo-btn" class="btn-ghost btn-small">Undo</button>
      </div>
    </section>
    <aside class="kb-side">
      <section class="card" aria-label="Add entry">
        <form id="kb-add-form" class="kb-add-form">
          <h3 class="card-title">Add new entry</h3>
          <input type="text" id="kb-question" placeholder="Question (optional, e.g. 'How do I reset my password?')" autocomplete="off" />
          <textarea id="kb-response" rows="3" placeholder="Answer text (required)…" required></textarea>
          <button type="submit" id="kb-add-btn" class="btn-primary" title="Add entry and re-embed immediately">Add entry</button>
        </form>
      </section>
    </aside>
  </main>

  <script src="/static/kb.js?v=5"></script>
</body>
</html>
